name: 毎朝のエンジニアあるある投稿

on:
  schedule:
    # 23:00 UTC = 08:00 JST。GitHub Actions の cron は UTC 固定。
    # 混雑時は数分〜十数分遅れて起動することがある。
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '投稿せず、生成結果の確認だけ行う'
        type: boolean
        default: true

concurrency:
  group: daily-aruaru
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r requirements.txt

      - name: あるあるを生成して投稿
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m aruaru --dry-run --verbose
          else
            python -m aruaru --verbose
          fi

      - name: 履歴をコミット
        if: ${{ inputs.dry_run != true }}
        run: |
          if git diff --quiet -- data/history.json; then
            echo "履歴に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "あるある投稿履歴を更新 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
          git push origin HEAD:${{ github.ref_name }}
